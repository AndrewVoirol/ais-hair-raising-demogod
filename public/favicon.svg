  <circle cx="37" cy="34" r="5" stroke="#000" stroke-width="2" fill="rgba(255,255,255,0.15)"/>
  <path d="M32 34 L32 34" stroke="#000" stroke-width="2"/>
  <path d="M22 34 L18 32 M42 34 L46 32" stroke="#000" stroke-width="1.5"/>

